# Override para CI: agrega gateway Traefik HTTP plano (sin TLS).
# Usa la misma red tickit_net que el compose base (se crea en el paso de CI).

services:
  gateway:
    image: traefik:v3.3
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - ./gateway/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    restart: unless-stopped
