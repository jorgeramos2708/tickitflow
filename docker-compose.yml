name: tickitflow

# TickITFlow — 7 microservicios NestJS detrás del nginx del host (tickit_net)
#
# Producción: el deploy script crea docker-compose.override.yml en el servidor
#             con la configuración de red externa tickit_net.
#
# CI/Desarrollo: funciona standalone sin red externa.

services:
  # El bucket se crea en el deploy del servidor (scripts/init-minio.sh)
  # No se incluye aquí para no ralentizar el arranque en CI

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tickit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-tickit}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d auth"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth:
    build: ./services/auth
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-true}
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      PORT: "4001"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  incidents-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: incidents
    volumes:
      - incidents-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  incidents:
    build: ./services/incidents
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@incidents-db:5432/incidents
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickit}:${RABBITMQ_PASS:-tickit}@rabbitmq:5672
      PORT: "4003"
    depends_on:
      incidents-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  problems-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: problems
    volumes:
      - problems-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d problems"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  problems:
    build: ./services/problems
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@problems-db:5432/problems
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickit}:${RABBITMQ_PASS:-tickit}@rabbitmq:5672
      PORT: "4005"
    depends_on:
      problems-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  changes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: changes
    volumes:
      - changes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d changes"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  changes:
    build: ./services/changes
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@changes-db:5432/changes
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickit}:${RABBITMQ_PASS:-tickit}@rabbitmq:5672
      PORT: "4006"
    depends_on:
      changes-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  cmdb-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: cmdb
    volumes:
      - cmdb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d cmdb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cmdb:
    build: ./services/cmdb
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@cmdb-db:5432/cmdb
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      PORT: "4007"
    depends_on:
      cmdb-db:
        condition: service_healthy
    restart: unless-stopped

  clients:
    build: ./services/clients
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@clients-db:5432/clients
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      PORT: "4010"
    depends_on:
      clients-db:
        condition: service_healthy
    restart: unless-stopped

  clients-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: clients
    volumes:
      - clients-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d clients"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kb-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: kb
    volumes:
      - kb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d kb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kb:
    build: ./services/kb
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@kb-db:5432/kb
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      PORT: "4008"
    depends_on:
      kb-db:
        condition: service_healthy
    restart: unless-stopped

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickit}
      POSTGRES_DB: notifications
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  notifications:
    build: ./services/notifications
    environment:
      DATABASE_URL: postgres://tickit:${POSTGRES_PASSWORD:-tickit}@notifications-db:5432/notifications
      JWT_SECRET: ${JWT_SECRET:-tickitflow-dev-secret-not-for-production-32chars}
      # Clave dedicada del cifrado en reposo (smtp.pass). Sin ella se usa la
      # derivación v1 del JWT_SECRET — configurarla desacopla la rotación
      # de credenciales de auth del cifrado de settings (hallazgo S1)
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickit}:${RABBITMQ_PASS:-tickit}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-tickitflow@edrs.xyz}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      PORT: "4009"
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - auth
      - incidents
      - problems
      - changes
      - cmdb
      - kb
      - notifications
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-tickit}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASS:-tickit}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tickit}
      BACKUP_INTERVAL_HOURS: "6"
      BACKUP_RETENTION: "4"
    volumes:
      - ./scripts/backup-dbs.sh:/backup-loop.sh:ro
      - db-backups:/backups
    depends_on:
      auth-db:
        condition: service_healthy
      incidents-db:
        condition: service_healthy
      problems-db:
        condition: service_healthy
      changes-db:
        condition: service_healthy
      cmdb-db:
        condition: service_healthy
      kb-db:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
    entrypoint: ["sh", "/backup-loop.sh"]
    restart: unless-stopped

volumes:
  auth-db-data:
  incidents-db-data:
  problems-db-data:
  changes-db-data:
  cmdb-db-data:
  clients-db-data:
  kb-db-data:
  notifications-db-data:
  prometheus-data:
  grafana-data:
  db-backups:
