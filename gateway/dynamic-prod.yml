# Configuración dinámica de PRODUCCIÓN del gateway: routers con TLS + certificado.
# En dev se usa gateway/dynamic.yml (solo HTTP). Producción con dominio real:
# sustituye el certificado autofirmado por certificatesResolvers de Let's Encrypt.

http:
  routers:
    # Todo el tráfico plano HTTP se promueve a HTTPS
    http-redirect:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      priority: 1000
      middlewares: [https-redirect]
      service: noop@internal
    auth:
      rule: PathPrefix(`/api/auth`)
      entryPoints: [websecure]
      middlewares: [auth-strip]
      service: auth
      tls: {}
    incidents:
      rule: PathPrefix(`/api/incidents`)
      entryPoints: [websecure]
      middlewares: [incidents-strip]
      service: incidents
      tls: {}
    problems:
      rule: PathPrefix(`/api/problems`)
      entryPoints: [websecure]
      middlewares: [problems-strip]
      service: problems
      tls: {}
    changes:
      rule: PathPrefix(`/api/changes`)
      entryPoints: [websecure]
      middlewares: [changes-strip]
      service: changes
      tls: {}
    cmdb:
      rule: PathPrefix(`/api/cmdb`)
      entryPoints: [websecure]
      middlewares: [cmdb-strip]
      service: cmdb
      tls: {}
    clients:
      rule: PathPrefix(`/api/clients`)
      entryPoints: [websecure]
      middlewares: [clients-strip]
      service: clients
      tls: {}
    kb:
      rule: PathPrefix(`/api/kb`)
      entryPoints: [websecure]
      middlewares: [kb-strip]
      service: kb
      tls: {}
    notifications:
      rule: PathPrefix(`/api/notifications`)
      entryPoints: [websecure]
      middlewares: [notifications-strip]
      service: notifications
      tls: {}
    frontend:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints: [websecure]
      middlewares: [rate-limit]
      service: frontend
      tls: {}
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    auth-strip:
      stripPrefix:
        prefixes: ["/api/auth"]
    incidents-strip:
      stripPrefix:
        prefixes: ["/api/incidents"]
    problems-strip:
      stripPrefix:
        prefixes: ["/api/problems"]
    changes-strip:
      stripPrefix:
        prefixes: ["/api/changes"]
    cmdb-strip:
      stripPrefix:
        prefixes: ["/api/cmdb"]
    clients-strip:
      stripPrefix:
        prefixes: ["/api/clients"]
    kb-strip:
      stripPrefix:
        prefixes: ["/api/kb"]
    notifications-strip:
      stripPrefix:
        prefixes: ["/api/notifications"]
  services:
    auth:
      loadBalancer:
        servers:
          - url: "http://auth:4001"
    incidents:
      loadBalancer:
        servers:
          - url: "http://incidents:4003"
    problems:
      loadBalancer:
        servers:
          - url: "http://problems:4005"
    changes:
      loadBalancer:
        servers:
          - url: "http://changes:4006"
    cmdb:
      loadBalancer:
        servers:
          - url: "http://cmdb:4007"
    clients:
      loadBalancer:
        servers:
          - url: "http://clients:4010"
    kb:
      loadBalancer:
        servers:
          - url: "http://kb:4008"
    notifications:
      loadBalancer:
        servers:
          - url: "http://notifications:4009"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"

tls:
  certificates:
    - certFile: /certs/tickitflow.crt
      keyFile: /certs/tickitflow.key
