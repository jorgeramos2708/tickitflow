name: CI

on: [push, pull_request]

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - incidents
          - problems
          - changes
          - cmdb
          - clients
          - kb
          - notifications
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Compilar servicio
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          npm install
          npm run build
          npm test

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Probar y compilar frontend
        working-directory: frontend
        shell: bash
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          npm ci
          npm run test
          npm run lint
          npm run build

  e2e:
    name: E2E del stack (compose)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Levantar el stack completo (gateway HTTP para CI)
        shell: bash
        run: |
          docker network create caddy_net 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Verificar stack
        shell: bash
        run: |
          echo "Node: $(node --version)"
          echo "--- docker compose ps ---"
          docker compose ps --format "table {{.Name}}\t{{.Status}}" || true
          echo "--- probando gateway ---"
          curl -s http://127.0.0.1/api/incidents/health || echo "gateway no responde"
          echo ""
      - name: Esperar salud de los servicios
        shell: bash
        run: |
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            all_healthy=true
            for svc in auth incidents problems changes cmdb clients kb notifications; do
              if ! curl -sf "http://127.0.0.1/api/$svc/health" > /dev/null 2>&1; then
                all_healthy=false
                echo "Esperando: $svc (elapsed=${elapsed}s)"
                break
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "Todos los servicios saludables (${elapsed}s)"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Timeout tras ${timeout}s"
          exit 1
      - name: Smoke E2E
        shell: bash
        run: node scripts/e2e-smoke.mjs
      - name: Logs al fallar
        if: failure()
        shell: bash
        run: docker compose logs --tail 40


  deploy:
    name: Deploy + Publicar a Zot
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '2222' }}
          command_timeout: 30m
          script: |
            set -e
            set -o pipefail
            echo "=== TickITFlow deploy ==="

            DEPLOY_DIR=/opt/tickitflow
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Clonando repo..."
              git clone https://github.com/jorgeramos2708/tickitflow.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git remote set-url origin https://github.com/jorgeramos2708/tickitflow.git
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e certs/ -e docker-compose.override.yml
            echo "Git: $(git log --oneline -1)"

            # Override de red: conectar a caddy_net del host
            cat > docker-compose.override.yml << 'OVR'
            networks:
              default:
                name: caddy_net
                external: true
            OVR

            # Nota: el override de MinIO (docker-compose.minio.yml) se retiro.
            # minio/minio y quay.io/minio/minio ya no permiten pull anonimo
            # (MinIO cerro sus imagenes publicas en 2025) y su ausencia hacia
            # fallar `docker compose up -d` en cada deploy — enmascarado por
            # el pipe a tail. Para reactivar adjuntos via MinIO: montar la
            # imagen desde una fuente accesible (cuenta MinIO, bitnami/minio
            # o docker save/load hacia Zot) y volver a anadir el override.

            # Login al Zot registry
            echo "${{ secrets.ZOT_CI_PASSWORD }}" | docker login registry.edrs.xyz --username "${{ secrets.ZOT_CI_USER }}" --password-stdin

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.override.yml"

            echo "--- build ---"
            $COMPOSE build 2>&1 | tail -3

            echo "--- tag + push a Zot ---"
            for svc in auth incidents problems changes cmdb clients kb notifications frontend; do
              COMPOSE_IMAGE="tickitflow-$svc"
              if docker image inspect "$COMPOSE_IMAGE" > /dev/null 2>&1; then
                docker tag "$COMPOSE_IMAGE" "registry.edrs.xyz/tickitflow/$svc:latest"
                ok=0
                for attempt in 1 2 3; do
                  if docker push "registry.edrs.xyz/tickitflow/$svc:latest" > /dev/null 2>&1; then
                    ok=1
                    echo "OK: $svc (intento $attempt)"
                    break
                  fi
                  echo "push de $svc fallo (intento $attempt), reintentando en 5s..."
                  sleep 5
                done
                if [ "$ok" != "1" ]; then
                  echo "FALLO: push de $svc tras 3 intentos:"
                  docker push "registry.edrs.xyz/tickitflow/$svc:latest" 2>&1 | tail -3
                  exit 1
                fi
              else
                echo "SKIP: $svc"
              fi
            done

            echo "--- up ---"
            $COMPOSE up -d 2>&1 | tail -3

            echo "--- health check ---"
            DOMAIN=tickitflow.edrs.xyz
            MAX_WAIT=120
            elapsed=0
            while [ $elapsed -lt $MAX_WAIT ]; do
              all_ok=true
              for svc in auth incidents problems changes cmdb clients kb notifications; do
                if ! curl -sf "https://$DOMAIN/api/$svc/health" > /dev/null 2>&1; then
                  all_ok=false
                  break
                fi
              done
              if [ "$all_ok" = true ]; then
                echo "=== DEPLOY + PUSH EXITOSO ==="
                exit 0
              fi
              echo "Esperando... ${elapsed}s"
              sleep 10
              elapsed=$((elapsed + 10))
            done

            echo "=== TIMEOUT ==="
            docker compose ps
            exit 1
